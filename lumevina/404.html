<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Lumevina Aesthetics Spa</title>
  <meta name="description" content="That page isn't here. Head back to Lumevina Aesthetics Spa to book a facial or shop skincare.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="theme-color" content="#FBFAF7">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    /* paths start with a slash: a missing page can be at any depth, and this page is served in its place */
    .nf { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 2rem 1.5rem; text-align: center; }
    .nf-in { max-width: 30rem; display: grid; gap: 1rem; justify-items: center; }
    .nf-logo { width: min(15rem, 70vw); height: auto; opacity: 0.85; }
    .nf h1 { font-family: var(--font-display); font-size: clamp(2rem, 7vw, 2.8rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; color: var(--plum); margin: 0.6rem 0 0; }
    .nf p { margin: 0; color: var(--ink-60); }
    .nf-actions { display: flex; flex-wrap: wrap; gap: 0.8rem; justify-content: center; margin-top: 0.8rem; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-in">
      <img class="nf-logo" src="/img/logo-full.svg" alt="Lumevina Aesthetics Spa" width="2620" height="1880">
      <h1>That page isn't here.</h1>
      <p>The link may be old, or the address typed a little off. Here's the way back.</p>
      <div class="nf-actions">
        <a class="btn btn-solid" href="/#book">Book a facial</a>
        <a class="btn btn-ghost" href="/#shop">Shop skincare</a>
        <a class="btn btn-ghost" href="/">Home</a>
      </div>
    </div>
  </main>
</body>
</html>
