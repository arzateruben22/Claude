:root {
  color-scheme: dark;
  --bg: #0b0e14; --panel: #121821; --panel-2: #18202c; --line: #263244; --fg: #e8eef7; --muted: #9aa6b8; --subtle: #6f7b8d;
  --accent: #4cc9ff; --accent-ink: #06121c; --gold: #f3c75b; --ok: #3ddc97; --warn: #f5a524; --bad: #ff7a7a;
  --display: "Sora", "Segoe UI", system-ui, sans-serif; --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { color-scheme: light; --bg: #f3f6fa; --panel: #ffffff; --panel-2: #f1f4f9; --line: #d5dde8; --fg: #0f172a; --muted: #475569; --subtle: #6b7789; --accent: #0b74b3; --accent-ink: #ffffff; --gold: #946200; --ok: #137a3b; --warn: #a85a06; --bad: #b42323; } }
:root[data-theme="light"] { color-scheme: light; --bg: #f3f6fa; --panel: #ffffff; --panel-2: #f1f4f9; --line: #d5dde8; --fg: #0f172a; --muted: #475569; --subtle: #6b7789; --accent: #0b74b3; --accent-ink: #ffffff; --gold: #946200; --ok: #137a3b; --warn: #a85a06; --bad: #b42323; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
h1 { font-family: var(--display); font-size: clamp(28px, 5vw, 40px); line-height: 1.08; margin: 0 0 10px; text-wrap: balance; }
.lede { color: var(--muted); max-width: 66ch; margin: 0; }
.notice { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 12px; padding: 14px 16px; }
.notice h2 { font-family: var(--display); font-size: 15px; margin: 0 0 6px; }
.notice ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.notice li { margin: 3px 0; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-top: 22px; padding-block: 10px; display: grid; gap: 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { font: inherit; font-weight: 600; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.tab .n { font-family: var(--mono); font-weight: 500; margin-left: 6px; opacity: .85; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--muted); }
.tools select, .tools button, .btn { font: inherit; font-size: 13px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; cursor: pointer; }
.tools label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.progress { flex: 1 1 180px; min-width: 0; display: grid; gap: 4px; }
.progress .track { height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.progress .fill { height: 100%; width: 0; background: var(--ok); transition: width .3s; }
.sync { font-family: var(--mono); font-size: 11px; color: var(--subtle); }
.list { display: grid; gap: 16px; margin-top: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
.card.applied { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.card.skipped { opacity: .62; }
.head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: start; }
.rank { font-family: var(--mono); font-size: 13px; color: var(--subtle); padding-top: 4px; }
.title { font-family: var(--display); font-size: 19px; line-height: 1.25; margin: 0; overflow-wrap: anywhere; }
.where { color: var(--muted); margin: 2px 0 0; font-size: 14px; }
.score { text-align: center; min-width: 58px; border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; background: var(--panel-2); }
.score b { display: block; font-family: var(--display); font-size: 22px; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.score span { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--subtle); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 14px; }
.fact { background: var(--panel-2); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.fact small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--subtle); }
.fact p { margin: 2px 0 0; font-weight: 500; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.fact p span { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; color: var(--muted); }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.why { margin: 12px 0 0; color: var(--fg); }
.why + .why { color: var(--muted); font-size: 14px; margin-top: 6px; }
.alert { margin-top: 12px; border-radius: 10px; padding: 10px 12px; font-size: 14px; border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 9%, var(--panel)); }
.alert b { color: var(--warn); }
.alert ul { margin: 6px 0 0; padding-left: 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.apply { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; border-radius: 10px; padding: 10px 16px; }
.apply small { font-weight: 400; opacity: .8; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; color: var(--muted); background: var(--panel); border: 0; border-left: 1px solid var(--line); padding: 9px 12px; cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); font-weight: 600; }
.seg button[data-status="applied"][aria-pressed="true"] { color: var(--ok); }
.date { font: inherit; font-size: 13px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 7px 8px; }
details { margin-top: 10px; border-top: 1px solid var(--line); }
details:first-of-type { margin-top: 16px; }
summary { cursor: pointer; padding: 11px 0 9px; font-weight: 600; font-size: 14px; list-style-position: inside; }
summary span { font-weight: 400; color: var(--muted); margin-left: 6px; }
.sect { padding: 0 0 12px; font-size: 14px; color: var(--muted); }
.sect ul { margin: 6px 0; padding-left: 18px; }
.sect li { margin: 4px 0; }
.sect h4 { margin: 12px 0 2px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--subtle); font-weight: 600; }
.row { display: grid; grid-template-columns: 110px minmax(60px, 1fr) 44px; gap: 10px; align-items: center; margin: 7px 0 0; }

.row .fill { height: 100%; background: var(--accent); }

.row + p { margin: 2px 0 0 120px; font-size: 13px; }
.req { display: flex; gap: 9px; align-items: flex-start; margin: 6px 0; color: var(--fg); cursor: pointer; }

blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--line); color: var(--fg); font-size: 13px; }
blockquote a, .sect a, .ruled a { color: var(--accent); overflow-wrap: anywhere; }
.ruled { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.ruled p { margin: 0; }
.ruled p + p { color: var(--muted); font-size: 14px; margin-top: 3px; }
.ruled ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.ruled li { margin: 5px 0; overflow-wrap: anywhere; }
.ruled .chips { margin: 8px 0; }
.list > .lede { margin-bottom: 2px; }
.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 14px; padding: 26px; text-align: center; color: var(--muted); }
.method { margin-top: 36px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; color: var(--muted); font-size: 14px; }
.method h2 { font-family: var(--display); font-size: 16px; color: var(--fg); margin: 0 0 8px; }
.method table { border-collapse: collapse; width: 100%; margin: 8px 0; }

.scroll { overflow-x: auto; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

e semester of college algebra with a 'C' or better"],"processSteps":["Written test (DAS listing: yes)","Oral exam/interview (DAS listing: yes)"],"durationYears":5,"classroomHours":null,"startingWage":null,"startingWageVerified":false,"fees":null,"contact":{"phone":"(818) 762-4239","address":"5643 Vineland Avenue, North Hollywood, CA 91601"},"recruitmentStatus":"CLOSED","recruitmentNote":"CLOSED as of 2026-10-21. An IBEW Local 40 news item (open-house article on ibew40.org) states new Inside Wireman apprenticeship applications are slated to reopen in Spring 2028. Program length is 60 months per the DAS listing. Starting wage (DAS listing: 'Contact Program'), classroom hours and fees were not retrieved and are stored as null. The DAS listing names Jesse Barron as training director. The apply URL points to the DAS program detail page because no program-run application page was retrieved.","sourceUrls":["https://www.dir.ca.gov/databases/das/results_aigdetail.asp?varOccId=2726","https://ibew40.org/open-house-draws-enthusiastic-crowd/","https://ibew40.org/agreements-wages/","https://www.dir.ca.gov/databases/das/results_aiglist.asp?varCounty=LOS+ANGELES&varType=22"],"verifiedOn":"2026-10-21"},{"slug":"la-county-its-electrical-jatc","name":"LA County ITS Electrical Joint Apprenticeship and Training Committee (Transportation Systems Electrician)","sponsor":"IBEW Local 11 / NECA (training delivered through the Electrical Training Institute)","region":"Los Angeles County","isUnion":true,"website":"https://laett.com/index.cfm?page=Transportation&zone=%2Funionactive%2Fview_page.cfm","applyUrl":"https://www.laett.com/Apprenticeship%20handouts/TSA%20Official%20Notice%20-%2001-29-24.pdf","eligibility":[],"processSteps":[],"durationYears":null,"classroomHours":null,"startingWage":null,"startingWageVerified":false,"fees":null,"contact":{"phone":"(323) 221-5881","address":"6023 S. Garfield Ave, Commerce, CA 90040 (ETI)"},"recruitmentStatus":"UNVERIFIED","recruitmentNote":"UNVERIFIED as of 2026-10-21. The program appears in the DAS Los Angeles County electrician program list, and a DIR prevailing-wage apprentice rate table exists for 'Transportation Systems Electrician' (Los Angeles 2026-1), but no dated application window, eligibility details, process steps, program length, classroom hours, wage figures or fees were retrieved; those fields are stored as empty/null rather than guessed. The apply URL is ETI's TSA Official Notice dated 01-29-24 and may be outdated. Contact ETI at (323) 221-5881 to confirm.","sourceUrls":["https://www.dir.ca.gov/databases/das/results_aiglist.asp?varCounty=LOS+ANGELES&varType=22","https://www.dir.ca.gov/oprl/pwappwage/wage/26119227.html?VarWageId=26119227","https://laett.com/index.cfm?page=Transportation&zone=%2Funionactive%2Fview_page.cfm","https://www.laett.com/Apprenticeship%20handouts/TSA%20Official%20Notice%20-%2001-29-24.pdf"],"verifiedOn":"2026-10-21"}],"programsCheckedLabel":"October 21, 2026","watch":[{"label":"City of Los Angeles, LADWP, LA Metro, ports and airports","items":["LADWP Electric Distribution Mechanic Trainee (3879) - REAL AND OPEN but not returned: LADWP's careers page lists applications 05/25/26 to 11/27/26 and the bulletin is at https://www.governmentjobs.com/careers/lacity/jobs/4642828-0/electric-distribution-mechanic-e-3879-trainee-revised-5-21-25 . Excluded because no pay figure was captured before the search budget ran out, and because the qualifying paths found are not beginner-reachable by 11/27 (certificate from the LA Trade-Tech Powerline Mechanic-Trainee Program, or eighteen months of line clearance tree trimming, or six months on a distribution/transmission crew). It also requires driving commercial vehicles, with a California Class A license before journey-level appointment. Worth a manual look if the resume shows any of those paths.","LADWP Underground Distribution Construction Mechanic - listed on LADWP's careers page as open 10/30/26 to 11/12/26 (closes tomorrow). Requirements and pay could not be retrieved (search budget exhausted), so not returned.","LADWP Instrument Mechanic - listed as open 11/06/26 to 11/19/26; no requirements or pay retrieved; this class is normally journey-level, so not returned.","City of LA Electrical Craft Helper (3799) - NOT open: Filing Period 1 was June 5-18, 2026; Filing Period 2 is 'future dates to be determined'. Watch https://www.governmentjobs.com/careers/lacity/jobs/5247056-0/electrical-craft-helper-3799-rev-02-23-26 for the next window.","City of LA Mechanical Helper (3771) - closed: application window was October 2-15, 2026.","City of LA Maintenance and Construction Helper (3115) - not open yet: tentative bulletin window January 29 to February 11, 2027.","City of LA / LADWP Building Repairer (3333) - not open yet: tentative bulletin open date 11/20/26 (LADWP lists 11/20/26 to 12/03/26). No pay or requirements were captured. Opens nine days from today, worth re-checking.","City of LA Maintenance and Construction Helper Trainee (3103) - not open to the general public: applicants must already be in the City's Bridge-to-Jobs candidate pool with a hiring-department letter. Bulletin pay was $47,773 to $65,813 per year (revised 03-28-25).","City of LA Electrical Test Technician (7512) - closed November 5, 2026 and required prior helper/trainee background.","City of LA Electric Station Operator (5224) - last window May 8-21, 2026; no current filing period found.","City of LA Assistant Inspector (4208) - no 2026 open filing bulletin found; last open filing seen was September 2024.","City of LA Elevator Mechanic Helper, Air Conditioning Mechanic helper classes, Maintenance Laborer, Steam Plant Assistant, Water Utility Worker, Electric Meter Setter - no 2026 bulletin or open filing period surfaced in search results.","LA Metro - Electrician ($46.33-$57.91/hr) closed August 10, 2026; Sr. Service Attendant was ATU-employees-only and closed 1/9/2026; Custodian postings closed (latest 6/1/2026); Entry Level Trainee Program requires a bachelor's degree earned in the last two years and is temporary. No open Service Attendant, Facilities Maintainer, Rail Electronic Communications Inspector trainee, Traction Power or Elevator/Escalator trainee posting was found.","Los Angeles World Airports - hires trades through the City of LA civil service exams above; no separately open LAWA trades posting with pay could be confirmed (its listing page showed older 2026 entries such as Communications Electrician dated 02/23/2026).","Port of Long Beach / City of Long Beach - nothing suitable open: Assistant Director of Maintenance closed October 26, 2026; Director of Maintenance closed August 4, 2026; Maintenance Assistant III (non-career, custodial) closed August 3, 2026.","Metrolink (SCRRA) - no current maintenance, signal or facilities opening with a 2026 date and pay was found; results were an old 2024 signal intern posting and undated job descriptions."]},{"label":"Counties, cities and water or sanitation districts","items":["BEST-FIT: none returned. No trainee / apprentice / helper posting in this slice could be confirmed as accepting applications on 2026-11-11 with a pay figure on the employer's own site. Every entry-level posting found was closed or undated.","County of Los Angeles: 'Helper, Electrical' bulletin (governmentjobs.com/careers/lacounty/jobs/newprint/4208505, $4,167.46 - $4,772.82 monthly) closed 6/13/2025; Electrician exam closed 7/17/2025; General Maintenance Worker exam R6619N-R closed 12/9/2025. General Maintenance Worker exam R6619O-R (governmentjobs.com/careers/lacounty/jobs/newprint/5342310, $4,542.92 - $5,492.64 monthly) showed no filing deadline, requires two years of building maintenance experience in two trades, and tops out below $80K, so not returned. Nothing found for Building Crafts Helper, Refrigeration Mechanic helper or Power Plant Operator trainee.","LA County Sanitation Districts: Electrical & Instrumentation Technician Apprentice I/II (LA-039-26) was internal-only and closed 2/11/2026; public postings found were journey-level (4 years experience) and closed. 'General Services Worker I, II (AA-055-26E)' (governmentjobs.com/careers/lacsd/jobs/newprint/5288393) appeared with no date or pay in the extract - unverified lead.","Metropolitan Water District: no open apprenticeship window. A pre-apprentice posting ran July-August 2026 and has closed. Program page to watch: mwdh2o.com/apprenticeships-internships/ (Oct 2024 flyer: start $22.54/hr, graduate rate $48.60/hr - dated figures).","Orange County Sanitation District: Operator-In-Training ($38.04 - $46.25 hourly) closed 9/22/2025; Vocational Intern closed 5/14/2026; Reliability Maintenance Technician closed 11/5/2026. Planner-Scheduler (Construction Management), about $134,950.40 - $164,028.80 a year per Indeed, closes 11/12/2026 per the CASA and OCWA boards, but no OC San posting URL or requirements were found, so not returned.","Anaheim Public Utilities: Apprentice Water Production Technician closed 3/13/2026; Apprentice Substation Test Technician closed 10/15/2025. A combined Line Mechanic / Apprentice Line Mechanic bulletin (governmentjobs.com/careers/anaheim/jobs/newprint/2965474, apprentice $38.28 - $46.57 hourly) has no date and an old job ID, so it is probably stale - not returned.","Burbank Water and Power: all closed. Electrician Apprentice, Line Mechanic Apprentice and Pipefitter Apprentice closed 3/6/2026; Power System Operator Trainee closed 3/13/2026; Power Plant Operator / Maintenance Trainee closed 1/23/2026; newest Pipefitter Apprentice (governmentjobs.com/careers/burbankca/jobs/5453693) posted 8/21/2026, closed 9/11/2026. Burbank reposts these classes regularly - worth a job alert.","Glendale Water and Power: Station Electrician/Operator Apprentice closed 8/8/2025; Water System Helper closed 4/5/2026; Electrical Line Mechanic Apprentice bulletin undated.","Pasadena Water and Power: Electrical Craft Helper ($75,224.03 - $93,921.57 a year, four vacancies) was seen only on Indeed/career.com with no date; the latest governmentjobs.com bulletin found (job 24-188) closed 4/4/2024. Apprentice Electrical Distribution Mechanic (governmentjobs.com/careers/pasadena/jobs/newprint/1055721, $46.03 - $60.96 hourly) is undated with an old job ID. Apprentice Electrical Mechanic is promotional (current City employees only). Unverified stretch lead: Power Plant Operator (governmentjobs.com/careers/pasadena/jobs/5191571-0/power-plant-operator), opened 01/08/2026, continuous recruitment, $99,076.85 - $117,684.74 a year - not returned because its minimum requirements were not visible and it is not entry-level.","Irvine Ranch Water District: apart from the Maintenance Mechanic returned, Utility Construction Technician I ($59,112 - $115,860, one year of water construction experience) closed 5/28/2026; Metering Systems Technician I closed 6/23/2026; Operator II/III postings require State water/wastewater operator certificates (mandatory credential).","OCTA: Service Worker (careers.octa.net/octa-maintenance/jobs/3521, starting $24.99/hr, bus servicing incl. vehicle movement) is entry-level but undated, has an older job ID, is outside the target trades, and its path (Apprentice Mechanic $28.87 - $33.13, Journeyman Mechanic from $33.87) does not reach $100K - not returned. Facilities Technician-Electrical ($34.84 - $48.32/hr, three years electrical experience) and Facilities Technician HVAC ($34.79 - $48.25/hr), Santa Ana, were seen only on Indeed/Glassdoor; the only OCTA URL found (careers.octa.net/octa-careers/jobs/3613, Facilities Technician I/II) showed validity through 3/10/2026. Worth checking careers.octa.net directly as stretch leads.","Orange County Water District: Maintenance Scheduler/Planner closed 10/30/2026; Senior Instrumentation and Electrical Technician (closing 11/16/2026 per the OCWA board, about $106K-$132K per Glassdoor) is senior-level and no OCWD URL was found. MWDOC: nothing found. South Coast Water District: Part-Time Facilities Maintenance Worker I closed 10/29/2026.","LAUSD: no apprentice trade postings found; Plumber ($57.95 hourly) closed 11/10/2026."]},{"label":"Universities, colleges and hospitals","items":["SEARCH CUT SHORT: the workflow's shared web-search budget ran out after 21 searches in this slice, so coverage is partial. A follow-up run (or a higher CLAUDE_CODE_MAX_WEB_SEARCHES_PER_SESSION) is needed to finish it. Posting pages could not be opened to confirm open status; careers.cshs.org, csucareers.calstate.edu and www.kaiserpermanentejobs.org would have to be allowed in the session's network settings.","UCLA / UCLA Health: no apprentice or trainee trades posting found. Facilities Mechanic (Plumbing) jobs.ucla.edu/jobs/9228 was valid only through 2025-12-25 (closed); Laborer jobs.ucla.edu/jobs/11062 ran through 2026-09-05 (closed). A 'Facilities Worker' at $32.77/hr and a UCLA Health Lead Facilities Mechanic at $40.27/hr appeared only on Indeed with no date and no employer-site URL, so they were not returned.","USC: nothing beginner-suitable that reaches $80K. Maintenance Technician II, LA Memorial Coliseum ($27.79 - $30.66/hr, posted 05/21/2026) and Maintenance Technician IV ($34.08 - $34.90/hr, posted 01/29/2026, REQ20171454, mentions a Maintenance Pay for Knowledge and Skills Program with on-the-job training) are leads worth a manual look on usccareers.usc.edu, but requirements and open status were not confirmed. Maintenance Engineer, USC Arcadia Hospital ($28.91 - $37.95/hr) had no date. Engineer Module C ($43.00 - $44.78/hr) and AC Technician Module C ($41.23 - $45.98/hr) are lead/journey-level roles; Elevator Maintenance Mechanic Journeyman requires 3 years and looks stale.","CSU: CSULB Facilities Maintenance Mechanic (temporary) closed 2026-08-07; CSU Fullerton Facilities Maintenance Mechanic I dates from January 2026 and is probably closed. Nothing found for Cal State LA, CSUN or Cal Poly Pomona in the combined search.","LAUSD: careers.lausd.org lists craft openings (Carpenter, Senior Carpenter, Plumber, Heating and Air Conditioning Fitter, Roofer, Building/Construction Inspector) that require a completed apprenticeship or about five years of trade experience; no pay or filing dates were visible, and no Maintenance Worker, Building Engineer or apprentice posting was found. Assistant Plant Manager is promotional-only.","Long Beach USD: HVAC Technician (job 27-0055-5103, $39.41 - $48.83/hr) closed 2026-10-26; no other maintenance posting found.","City of Hope (Duarte): Facilities Mechanic II - HVAC ($29.12 - $43.68/hr, dated 2026-02-23, needs proficiency in two or more trades and a current CA driver's license) and Facilities Mechanic III - HVAC ($30.86 - $46.30/hr, HS + 4 years) surfaced, but no current employer-site posting URL or open date was confirmed before the budget ran out."]},{"label":"Building engineering and data centers","items":["IUOE Local 501 JATC (Southern California stationary engineer apprenticeship): NOT open. local501.org/ca states the program accepts applications every three (3) years; the last window was the 2025 Los Angeles Apprenticeship Opportunity (exam application opened May 1, 2025). No 2026 Southern California window was found (the 2026 notice on the site is for Southern Nevada). Requirements when it opens: age 18+, high school diploma or GED, TABE placement exam; apprentices start at 60% of journeyman wage with 5% steps every six months. JATC office: 2501 West Third Street, Los Angeles, (213) 385-2889.","CBRE (other LA roles): Building Engineer 265803 (posted 20-Mar-2026, 4-5 years of experience); Culinary Technician/Engineer (Building Engineer) Los Angeles 257330 ($88,000 - $100,000 annually, 3+ years, posting date not shown and likely older than March 2026); Union Engineer (Third Shift) 257359 (requires EPA 608); Union Chief Engineer Marina del Rey (8-10 years, Local 501 membership). None could be confirmed open today. No CBRE postings found for Irvine or El Segundo.","Disney / Disneyland Resort (disneycareers.com, Anaheim): Assistant Maintenance Engineer - Hotels - Full Time ($27.04 to $32.93 per hour, minimum 1 year of experience, typically night shifts) is the closest entry-level match but its posting date is 09/24/2025, too old to treat as open: https://www.disneycareers.com/en/job/anaheim/assistant-maintenance-engineer-hotels-full-time/391/86533019488. Maintenance Engineer - Full Time ($36.78 per hour, posted March 2026) requires 5 years of hotel/resort maintenance plus EPA 608 and stays under $80K. Operating Engineer - Full Time ($40.02 per hour) was posted December 2025. Lead for the industrial-maintenance slice, not returned here because requirements were not in the extract: Maintenance Mechanic (Outside Machinist - Non-Automotive) - Full Time, $41.63 to $50.68 per hour, posted September 2026, https://www.disneycareers.com/en/job/anaheim/maintenance-mechanic-outside-machinist-non-automotive-full-time/391/98250264688. No Burbank studio facilities postings surfaced."]},{"label":"Electrical contractors and utilities","items":["Southern California Edison - Distribution Groundman (excluded, strong lead to re-check): edisoncareers.com has groundman pages for Huntington Beach/Westminster (https://www.edisoncareers.com/job/23169844/distribution-groundman-huntington-beach-westminster-ca/), Santa Monica (job/22654035), South Bay/Torrance (job/23025921) and Catalina/Avalon (job/23999237), pay '$33.97 - $46.27' per hour (Catalina floor $38.47), IBEW Local 47. Excluded because the extracts say the listings are roughly 7 to 21 months old, a Metro West (Torrance) groundman listing showed an expiration of 2026-09-10, and the role requires a Class A commercial driver's license plus construction experience or an SCE-accredited pole-climbing certificate and the EEI CAST / physical tests.","Rosendin (Anaheim / Los Angeles): no material handler, pre-apprentice, trainee or helper posting; Anaheim openings are BIM, engineering, project management and internships. Field electricians are hired through the IBEW (https://www.rosendin.com/electricians/office/anaheim-ca/), no pay figure.","Helix Electric: Commerce, CA openings (Project Engineer, Assistant Project Manager, Spring 2027 intern) appeared only on ZipRecruiter; no employer-site posting URL or pay found, and no current LA/OC apprentice or trainee posting."]},{"label":"Elevator, commercial HVAC and piping","items":["IUEC Local 18 / NEIEP (Los Angeles/San Diego): no open or scheduled recruitment found. Most recent LA/San Diego window in the NEIEP Recruitment System was 04/01/2024 and reached its applicant limit. The only open 'Local 18' window (11/10/2026 - 11/20/2026, $25 testing fee) is for Las Vegas/Southern Nevada, not California. Watch https://neieprecruitment.org/start.","Otis: no California apprentice, helper or sales-trainee posting found on its own site. Field Operations Intern (Los Angeles, $20-$26/hr) is a summer internship dated September 2024 and likely closed; Sales Trainee posting is in Las Vegas. Only the Account Manager posting (returned as a stretch) is in LA.","UA Local 250 (Gardena) HVACR/steamfitter apprenticeship (https://hvacr.jjatc.com/apply-1): one source reports applications currently closed with reopening expected in early 2027; no open window confirmed on the JATC's own site.","UA Local 582 (Orange County, 1916 W. Chapman Ave., Orange, 714-978-0582): no published 2026 application dates found on ualocal582.org; DIR lists a 60-month program, age 18+, HS diploma/GED. Phone the hall for the next intake window.","UA Local 78 (Los Angeles): the local's own page (https://www.uaplumber78.com/apprentice-applicant) says 'All Applications are accepted Monday through Thursday, 7:30AM - 11:30AM by appointment only' (213-688-9090 option 3) and requires a diploma/GED and a 'Valid California State Issued Driver's License'. Not returned as a candidate because the extract was described as an old cached page and no pay figure from the local's own site was captured. Strong lead to verify by phone.","Trane Technologies: the only Brea apprentice requisition (Apprentice Rental Services Technician, JR-10786, dated August 24, 2026, $17.48-$42.83/hr, HS diploma) now says it is no longer accepting applications. Older 'Apprentice-Technician' Brea listing dated September 2025. Controls Technician - Brea (92600108) and Chiller Technician - Brea (10+ years) had no pay captured or are far above beginner level. Nothing found for City of Industry or Los Angeles."]},{"label":"Refineries, plants, aerospace and theme parks","items":["Chevron El Segundo - Maintenance Trainee (3-year program, $43.19/hour, machinist / metals / instrument-electrical crafts): the ideal beginner role in this slice, but its application window closed October 16, 2026 at 11:59pm PT. Not open. Watch https://careers.chevron.com/job/el-segundo/maintenance-trainee/38138/101620725632 and the El Segundo jobs page for the next cycle.","Chevron El Segundo - Coke Handler Trainee ($46.82 anticipated rate) closed May 17, 2026; Fire Fighter Trainee closed January 1, 2026; no El Segundo Operator Trainee posting found. Maintenance Team Lead is open through November 27, 2026 but requires 5+ years of industrial experience and showed no pay figure, so it was not returned.","PBF Energy / Torrance Refining - Process Operator Trainee ($43.08/hour starting rate): seen only on aggregators (Workopia 'posted 17 days ago', talents.vaia.com, ZipRecruiter). No posting URL on pbfenergy.com or PBF's own applicant system surfaced, and the aggregator copies conflict on requirements (5 years refining experience or a Process Technology program; valid driver's license; age 18+). Not returned; check https://www.pbfenergy.com/careers/ directly.","Valero Wilmington: only general careers pages surfaced; no specific open Wilmington operator-trainee or maintenance posting found.","Verification gap: none of the returned postings could be opened directly. To confirm they are live, these hosts would need to be allowed in the session's network settings: mpc.wd1.myworkdayjobs.com, www.disneycareers.com, jobs.disneycareers.com, boards.greenhouse.io."]},{"label":"Construction office roles","items":["Rosendin (Anaheim): LEAD ONLY, not returned. Indeed shows 'Assistant Project Manager Anaheim, CA $70,400 - $105,200 a year ... 16 days ago', described elsewhere as an entry-level project management position (bachelor's in construction management OR equivalent training and experience, plus 1 year construction experience). I could not tie the Anaheim requisition to a Rosendin-site URL: Workday req JR104666 shows $79,600.00-$119,400.00, which matches Rosendin's San Jose / Concord listings, not Anaheim, and JR105077 showed no location or pay. Check rosendin.wd1.myworkdayjobs.com/Careers filtered to Anaheim. No Rosendin project coordinator / project assistant posting found for LA/OC (Project Assistant JR104323 is Sacramento, $25.75-$38.60 hourly)."]}]}</script>

  var peek = function (id) { return state.jobs[id] || { status: "todo", appliedOn: "", checks: {}, letter: null }; };

  function persist() {

    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
    if (remoteRef) { dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 900); }
  }
  function flush() {
    if (!remoteRef || saving || !dirty) return;
    saving = true; dirty = false; setSync("Saving…");
    remoteRef.set(JSON.parse(JSON.stringify(state))).then(function () { setSync("Saved to your account"); }, function () { setSync("Saved on this device only"); })
      .then(function () { saving = false; if (dirty) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 900); } });

    if (!window.claude || typeof window.claude.use !== "function") { setSync("Saved on this device only"); return; }
    var timer = setTimeout(function () { if (!remoteRef) setSync("Saved on this device only"); }, 10000);
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (caps) {
      var db = caps[0], user = caps[1];
      if (!db || !user) throw new Error("unavailable");
      return user.id().then(function (id) {
        var ref = db.collection("data/users/" + id).doc("jobfinder");
        return ref.get().then(function (snap) {
          clearTimeout(timer);
          var remote = snap && snap.exists ? snap.data() : null;
          if (remote && remote.v === 1 && remote.jobs && (remote.updatedAt || 0) > (state.updatedAt || 0)) {
            state = remote;
            try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
            render();
          }
          remoteRef = ref;
          setSync("Synced to your account");
        });
      });
    }).catch(function () { clearTimeout(timer); setSync("Saved on this device only"); });
  }

  var MORE = DATA.bench || [];
  var LISTS = { best: DATA.bestFit, stretch: DATA.stretch.concat(MORE), ruled: DATA.ruledOut };
  var tracked = DATA.bestFit.concat(DATA.stretch, MORE);

  function drives(j) { return j.drivingRequirement !== "none stated" && j.drivingRequirement !== "unknown"; }
  function visible(j) {
    if (fField !== "all" && j.field !== fField) return false;
    if (fDrive && drives(j)) return false;
    if (fTodo && peek(j.id).status !== "todo") return false;
    return true;
  }

  function header() {
    $("stamp").textContent = "Searched " + DATA.generatedLabel + " · Los Angeles and Orange counties";
    $("lede").textContent = DATA.lede;
    var n = ["<h2>Read this before you apply</h2><ul>"];
    (DATA.notices || []).forEach(function (t) { var i = t.indexOf("||"); n.push("<li><b>" + esc(i > 0 ? t.slice(0, i) : t) + "</b>" + (i > 0 ? " " + esc(t.slice(i + 2)) : "") + "</li>"); });
    n.push("</ul>");
    $("notice").innerHTML = n.join("");
  }

  function tabs() {
    var defs = [["best", "Best fit", DATA.bestFit.length], ["stretch", "Stretch", DATA.stretch.length + MORE.length], ["routes", "Apprenticeship routes", (DATA.programs || []).length], ["watch", "Watch list", (DATA.watch || []).reduce(function (a, g) { return a + g.items.length; }, 0)], ["ruled", "Ruled out", DATA.ruledOut.length]];
    $("tabs").innerHTML = defs.map(function (d) {
      return '<button type="button" class="tab" role="tab" data-view="' + d[0] + '" aria-selected="' + (view === d[0]) + '">' + d[1] + '<span class="n">' + d[2] + "</span></button>";
    }).join("");
  }

  function fieldFilter() {
    var seen = {};
    tracked.forEach(function (j) { seen[j.field] = true; });
    var opts = ['<option value="all">All fields</option>'].concat(Object.keys(seen).sort().map(function (f) { return '<option value="' + esc(f) + '">' + esc(DATA.fieldLabels[f] || f) + "</option>"; }));
    $("f-field").innerHTML = opts.join("");
    $("f-field").value = fField;
  }

  function progress() {
    var applied = tracked.filter(function (j) { return peek(j.id).status === "applied"; }).length;
    var skipped = tracked.filter(function (j) { return peek(j.id).status === "skipped"; }).length;
    $("p-text").textContent = "Applied to " + applied + " of " + tracked.length + (skipped ? " · " + skipped + " skipped" : "");
    $("p-fill").style.width = (tracked.length ? Math.round((applied / tracked.length) * 100) : 0) + "%";
  }

  function chip(text, tone) { return '<span class="chip' + (tone ? " " + tone : "") + '">' + esc(text) + "</span>"; }

  function quotes(list) {
    return (list || []).slice(0, 4).map(function (e) {
      var u = safeUrl(e.sourceUrl);
      return "<blockquote>“" + esc(e.quote) + "”" + (u ? ' <a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(host(u)) + "</a>" : "") + "</blockquote>";
    }).join("");
  }

  function card(j, i) {
    var st = peek(j.id), v = j.verdict || {}, url = safeUrl(j.postingUrl), h = [];
    var ai = v.aiExposure ? v.aiExposure.level : null;
    h.push('<article class="card ' + esc(st.status) + '" data-id="' + esc(j.id) + '">');
    h.push('<div class="head"><span class="rank">#' + (i + 1) + '</span><div><h3 class="title">' + esc(j.title) + '</h3><p class="where">' + esc(j.employer) + " · " + esc(j.city) + (j.county && j.county !== "unknown" ? ", " + esc(j.county) + " County" : "") + '</p></div><div class="score" title="Fit score out of 100"><b>' + esc(j.score) + "</b><span>fit</span></div></div>");
    var annual = j.payMinAnnual || j.payMaxAnnual ? "about " + (j.payMinAnnual && j.payMaxAnnual && j.payMinAnnual !== j.payMaxAnnual ? money(j.payMinAnnual) + "–" + money(j.payMaxAnnual) : money(j.payMaxAnnual || j.payMinAnnual)) + " a year" : "";
    h.push('<div class="facts"><div class="fact"><small>Pay as posted</small><p>' + esc(j.payText) + (annual ? "<span>" + esc(annual) + "</span>" : "") + "</p></div>");
    h.push('<div class="fact"><small>Dates</small><p>' + (j.closingDate ? "Closes " + esc(j.closingDate) : "No closing date listed") + "<span>" + (j.postedDate ? "Posted " + esc(j.postedDate) : "Posting date not shown") + "</span></p></div>");
    h.push('<div class="fact"><small>Driving</small><p>' + esc(j.drivingRequirement.charAt(0).toUpperCase() + j.drivingRequirement.slice(1)) + "</p></div></div>");
    var chips = [chip(DATA.fieldLabels[j.field] || j.field)];
    if (ai) chips.push(chip(ai.charAt(0).toUpperCase() + ai.slice(1) + " AI exposure", ai === "low" ? "ok" : ai === "medium" ? "warn" : "bad"));
    if (j.unionOrProgram) chips.push(chip(j.unionOrProgram));
    if (j.employmentType) chips.push(chip(j.employmentType));
    if (j.requisitionId) chips.push(chip("Job ID " + j.requisitionId));
    h.push('<div class="chips">' + chips.join("") + "</div>");
    h.push('<p class="why">' + esc(j.whyFit) + "</p>");
    if (j.progression) h.push('<p class="why">Where it leads: ' + esc(j.progression) + "</p>");
    if (!j.checked) h.push('<div class="alert"><b>Found once, not double-checked.</b> This came from one pass of search results. The second pass that tries to disprove each posting could not run today. Open the posting and confirm it is live, the pay and the requirements before you invest time.</div>');
    else if (j.needsOpenCheck) h.push('<div class="alert"><b>Check first.</b> The second pass was only ' + Math.round(j.breakdown.open.value * 100) + "% confident this is still open. Look for a closing date on the page before you invest time.</div>");
    if ((j.gaps.driving || []).length) h.push('<p class="why">Driving: ' + esc(j.gaps.driving.join(" · ")) + "</p>");
    if (j.gaps.soft.length) {
      var gt = j.list === "stretch" ? "You may not meet every requirement." : "Check these against the posting.";
      var gs = !j.checked ? " These notes were written without being able to read the posting, so treat them as questions to answer on the page:" : " The posting asks for:";
      h.push('<div class="alert"><b>' + gt + "</b>" + gs + "<ul>" + j.gaps.soft.slice(0, 6).map(function (g) { return "<li>" + esc(g) + "</li>"; }).join("") + "</ul>" + (j.list === "stretch" ? "The cover letter and résumé notes below are written to be upfront about this. Nothing in them claims experience you have not told me about." : "") + "</div>");
    }
    if ((j.gaps.confirm || []).length) h.push('<p class="why">Have ready: ' + esc(j.gaps.confirm.join(" · ")) + "</p>");
    h.push('<div class="actions">');
    if (url) h.push('<a class="apply" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Open the posting <small>' + esc(host(url)) + "</small></a>");
    h.push('<div class="seg" role="group" aria-label="Status for ' + esc(j.title) + '">' + [["todo", "To do"], ["applied", "Applied"], ["skipped", "Skip"]].map(function (o) { return '<button type="button" data-status="' + o[0] + '" aria-pressed="' + (st.status === o[0]) + '">' + o[1] + "</button>"; }).join("") + "</div>");
    h.push('<label class="sync" for="d-' + esc(j.id) + '"' + (st.status === "applied" ? "" : " hidden") + '>on <input class="date" type="date" id="d-' + esc(j.id) + '" value="' + esc(st.appliedOn) + '"></label>');
    h.push("</div>");

    var reqs = j.minimumRequirements || [];
    var ticked = reqs.filter(function (_, k) { return st.checks[k]; }).length;
    h.push('<details><summary>What the posting asks for <span data-count>' + ticked + " of " + reqs.length + " ticked</span></summary><div class=\"sect\"><p>Tick only what is true for you. This is your own honest read of the fit.</p>" +
      reqs.map(function (r, k) { return '<label class="req" for="r-' + esc(j.id) + "-" + k + '"><input type="checkbox" id="r-' + esc(j.id) + "-" + k + '" data-req="' + k + '"' + (st.checks[k] ? " checked" : "") + "><span>" + esc(r) + "</span></label>"; }).join("") +
      ((j.preferredQualifications || []).length ? "<h4>Preferred, not required</h4><ul>" + j.preferredQualifications.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ul>" : "") + "</div></details>");

    if (v.coverLetter) {
      h.push('<details><summary>Cover letter draft <span>edit, then copy</span></summary><div class="sect"><p>Replace every [bracketed] part with your own facts before sending. Delete any sentence that is not true for you.</p><label class="sync" for="l-' + esc(j.id) + '">Cover letter</label><textarea id="l-' + esc(j.id) + '" data-letter spellcheck="true">' + esc(st.letter != null ? st.letter : v.coverLetter) + '</textarea><div class="actions"><button type="button" class="btn" data-copy>Copy letter</button><button type="button" class="btn" data-reset>Reset to draft</button><span class="sync" data-msg role="status"></span></div></div></details>');
    }
    if ((v.resumeEmphasis || []).length || (v.doNotClaim || []).length) {
      h.push('<details><summary>Résumé adjustments for this job <span>what to bring forward, what not to claim</span></summary><div class="sect">' +
        ((v.resumeEmphasis || []).length ? "<h4>Bring forward, where true</h4><ul>" + v.resumeEmphasis.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "") +
        ((v.doNotClaim || []).length ? "<h4>Do not claim unless it is true for you</h4><ul>" + v.doNotClaim.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "") + "</div></details>");
    }
    var order = ["access", "pay", "interest", "ai", "open", "driving"], names = { access: "Within reach", pay: "Pay", interest: "Your priorities", ai: "AI resilience", open: "Still open", driving: "Driving" };
    h.push('<details><summary>Why it scored ' + esc(j.score) + "</summary><div class=\"sect\">" + order.map(function (k) {
      var f = j.breakdown[k];
      return '<div class="row"><span>' + names[k] + '</span><div class="track"><div class="fill" style="width:' + Math.round(f.value * 100) + '%"></div></div><b>' + f.points.toFixed(1) + "</b></div><p>" + esc(f.note) + "</p>";
    }).join("") + "</div></details>");
    h.push('<details><summary>How this was checked</summary><div class="sect">' + (v.verdictReason ? "<p>" + esc(v.verdictReason) + "</p>" : "") +
      ((v.problems || []).length ? "<h4>Caveats the checker raised</h4><ul>" + v.problems.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "") +
      "<h4>Evidence from search results</h4>" + (quotes(v.independentEvidence) + quotes(j.evidence) || "<p>No quotes recorded.</p>") + "</div></details>");
    h.push("</article>");
    return h.join("");
  }

  function linkify(text) {
    return esc(text).replace(/https:\/\/[^\s<)]+[^\s<).,;]/g, function (u) { var ok = safeUrl(u.replace(/&amp;/g, "&")); return ok ? '<a href="' + esc(ok) + '" target="_blank" rel="noopener noreferrer">' + esc(host(ok)) + "</a>" : u; });
  }

  function program(p) {
    var u = safeUrl(p.applyUrl) || safeUrl(p.website), st = p.recruitmentStatus;
    var badge = st === "OPEN" ? chip("Open", "ok") : st === "CLOSED" ? chip("Closed right now", "bad") : chip("Status unverified: check the site", "warn");
    return '<div class="ruled"><p><b>' + esc(p.name) + "</b> · " + esc(p.sponsor || "") + " · " + esc(p.region || "") + '</p><div class="chips">' + badge + (p.isUnion ? chip("Union") : chip("Non-union")) + (p.durationYears ? chip(p.durationYears + " years") : "") + (p.startingWageVerified && p.startingWage ? chip("Starts " + p.startingWage) : chip("Starting wage not verified")) + "</div>" +
      (p.recruitmentNote ? "<p>" + esc(p.recruitmentNote) + "</p>" : "") + (u ? '<p><a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(host(u)) + "</a></p>" : "") + "</div>";
  }

  function ruled(j) {
    var u = safeUrl(j.postingUrl);
    return '<div class="ruled"><p><b>' + esc(j.title) + "</b> · " + esc(j.employer) + (j.payText ? " · " + esc(j.payText) : "") + "</p><p>" + esc(j.ruledOutReason || "") + (u ? ' · <a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">posting</a>' : "") + "</p></div>";
  }

  function render() {
    tabs(); progress();
    var src = LISTS[view] || [];
    var html;
    if (view === "routes") {
      html = (DATA.programs || []).length ? '<p class="lede">Paid apprenticeships you apply to directly with the program. Facts and recruitment status are from the research pass on ' + esc(DATA.programsCheckedLabel) + ", so confirm dates on each program's site.</p>" + DATA.programs.map(program).join("") : '<div class="empty">No programme data loaded.</div>';
    } else if (view === "watch") {
      html = (DATA.watch || []).length ? '<p class="lede">Entry routes the search found that are closed right now, open soon, or could not be confirmed. Dates are as reported in search results on ' + esc(DATA.generatedLabel) + ".</p>" + DATA.watch.map(function (g) { return '<div class="ruled"><p><b>' + esc(g.label) + "</b></p><ul>" + g.items.map(function (x) { return "<li>" + linkify(x) + "</li>"; }).join("") + "</ul></div>"; }).join("") : '<div class="empty">Nothing on the watch list.</div>';
    } else if (view === "ruled") {
      html = src.length ? '<p class="lede">Found during the search and left out. Listed so you can see what was considered and why.</p>' + src.map(ruled).join("") : '<div class="empty">Nothing was ruled out.</div>';
    } else {
      var shown = src.map(function (j, i) { return [j, i]; }).filter(function (p) { return visible(p[0]); });
      html = shown.length ? shown.map(function (p) { return (view === "stretch" && MORE.length && p[1] === DATA.stretch.length ? '<p class="lede">More stretch leads, ranked below the top ' + DATA.stretch.length + ".</p>" : "") + card(p[0], p[1]); }).join("") : '<div class="empty">' + (src.length ? "No jobs match these filters. Clear a filter to see them." : "No openings made this list in today's search.") + "</div>";
    }
    $("list").innerHTML = html;
  }

  function method() {
    var w = DATA.weights, rows = [["Within reach", w.access, "Requirements a beginner can meet. Any mandatory credential you lack rules a job out entirely."], ["Pay", w.pay, "Posted range against $80,000 a year. Paid apprenticeships with a documented progression are not penalised as heavily."], ["Your priorities", w.interest, "Electrician first, then the other fields in the order you listed them."], ["AI resilience", w.ai, "An estimate of how exposed the role's daily tasks are to automation. Hands-on, on-site work scores highest."], ["Still open", w.open, "The independent checker's confidence that it is accepting applications."], ["Driving", w.driving, "What the posting says about a licence, DMV record or company vehicle. Flagged, never assumed about you."]];
    $("method").innerHTML = "<h2>How the ranking works</h2><p>" + esc(DATA.methodNote) + "</p><div class=\"scroll\"><table><tr><th>Factor</th><th>Weight</th><th>What it measures</th></tr>" +
      rows.map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + Math.round(r[1] * 100) + "%</td><td>" + r[2] + "</td></tr>"; }).join("") + "</table></div><p>Assumptions used until your résumé is shared: " + esc(DATA.assumptions) + "</p><p>“Copy tracker CSV” puts every job and its status on your clipboard in a format the CareerQuest application tracker imports under Applications → Import → Spreadsheet.</p>";
  }

  function csv() {
    var q = function (v) { v = String(v == null ? "" : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
    var lines = [["Company", "Job Title", "Job URL", "Location", "Status", "Date Applied", "Salary", "Notes"].map(q).join(",")];
    tracked.forEach(function (j) {
      var st = peek(j.id);
      lines.push([j.employer, j.title, j.postingUrl, j.city + ", CA", st.status === "applied" ? "Submitted" : "Saved", st.status === "applied" ? st.appliedOn : "", j.payText, (j.list === "stretch" ? "Stretch. " : "") + "Job Finder " + DATA.generatedOn].map(q).join(","));
    });
    return lines.join("\n");
  }

  function copy(text, done) {
    var fail = function () { done(false); };
    try { navigator.clipboard.writeText(text).then(function () { done(true); }, fail); } catch (e) { fail(); }
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("button") : null;
    if (!t) return;
    if (t.dataset.view) { view = t.dataset.view; try { history.replaceState(null, "", "#" + view); } catch (err) {} render(); return; }
    if (t.id === "csv") { copy(csv(), function (ok) { t.textContent = ok ? "Copied" : "Copy failed"; setTimeout(function () { t.textContent = "Copy tracker CSV"; }, 1800); }); return; }
    var cardEl = t.closest(".card"); if (!cardEl) return;
    var id = cardEl.dataset.id, st;
    if (t.dataset.status) {
      st = js(id); st.status = t.dataset.status;
      if (st.status === "applied" && !st.appliedOn) st.appliedOn = today();
      persist();
      cardEl.className = "card " + st.status;
      cardEl.querySelectorAll(".seg button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.status === st.status)); });
      var lab = cardEl.querySelector('label[for="d-' + id + '"]'); if (lab) { lab.hidden = st.status !== "applied"; lab.querySelector("input").value = st.appliedOn; }
      progress();
      if (fTodo && st.status !== "todo") render();
      return;
    }
    var area = cardEl.querySelector("textarea[data-letter]"), msg = t.parentElement.querySelector("[data-msg]");
    if (t.hasAttribute("data-copy") && area) { copy(area.value, function (ok) { if (!ok) { area.focus(); area.select(); } if (msg) msg.textContent = ok ? "Copied to clipboard" : "Select all and copy manually"; }); return; }
    if (t.hasAttribute("data-reset") && area) {
      var job = tracked.filter(function (j) { return j.id === id; })[0];
      st = js(id); st.letter = null; persist(); area.value = job && job.verdict ? job.verdict.coverLetter : ""; if (msg) msg.textContent = "Draft restored";
    }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "f-field") { fField = t.value; render(); return; }
    if (t.id === "f-drive") { fDrive = t.checked; render(); return; }
    if (t.id === "f-todo") { fTodo = t.checked; render(); return; }
    var cardEl = t.closest ? t.closest(".card") : null; if (!cardEl) return;
    var st = js(cardEl.dataset.id);
    if (t.dataset.req != null) {
      if (t.checked) st.checks[t.dataset.req] = true; else delete st.checks[t.dataset.req];
      persist();
      var boxes = cardEl.querySelectorAll("input[data-req]"), n = 0; boxes.forEach(function (b) { if (b.checked) n++; });
      var c = cardEl.querySelector("[data-count]"); if (c) c.textContent = n + " of " + boxes.length + " ticked";
    } else if (t.type === "date") { st.appliedOn = t.value; persist(); }
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (!t.matches || !t.matches("textarea[data-letter]")) return;
    var cardEl = t.closest(".card"); if (!cardEl) return;
    js(cardEl.dataset.id).letter = t.value; persist();
  });

  var hash = (location.hash || "").replace("#", "");
  if (["best", "stretch", "routes", "watch", "ruled"].indexOf(hash) >= 0) view = hash;
  header(); fieldFilter(); method(); render();
  setSync("Saved on this device");
  connect();
})();
</script>
