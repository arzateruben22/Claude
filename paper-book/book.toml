# Paper Book settings. Paper money only: nothing here can place a real order.
#
# One section per desk that is still running, each with $1,000 of paper money (raised from $100 on 22 Oct 2026,
# when every desk started over). On 22 Oct 2026 the clear losers were retired on the evidence
# (history tests for big coins and stocks, live results for memecoins); their rulebooks are kept in each
# market's retired/ folder and their paper records stay on the server. A desk the code doesn't know by name
# says its label, kind, market, of (the desk it varies) and colour here.

# -- Memecoins (Night Desk): new Solana coins, live prices. All eight are on trial to the month end. ------
[memecoins_strict]                        # older coins, small bets, quick exits (desk-strict.toml)
folder = "../night-desk/output/strict/live"
demo_folder = "../night-desk/output/strict/demo"
start_bank = 1000.0

[memecoins_sniper]                        # coins 3-10 minutes old, 5% bets, +60% / -30%, out in 30 minutes
label = "Sniper memecoins"
kind = "coins"
market = "memecoins"
of = "memecoins"
color = "#9df1e3"
folder = "../night-desk/output/sniper/live"
