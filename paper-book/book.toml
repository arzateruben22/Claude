[report]
timezone = "America/Los_Angeles"
# The dates the book is read on: the first look, then the end-of-month assessment. The deck marks them on its
# time axis. After the month, the bar is a green week (see deck.py) for one desk.
checkpoints = { "first look" = 2026-10-23, "month end" = 2026-10-31 }

[alerts]                                  # phone pushes from watchdog.py (turn on with: bash server/alerts.sh)
day_loss_pct = 10.0                       # tell me when a desk loses this much of its bank in one day
summary_at = "20:00"                      # the evening summary, in the [report] time zone
