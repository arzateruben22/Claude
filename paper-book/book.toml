# The tournament: ten rulebooks per market, each on its own $100 of paper money, all running at once.
# A section is a desk; delete one to leave that desk out. Labels, colours and markets are set here because
# these desks aren't known to the code by name (see the top of paperbook.py).

[memecoins_sniper]                        # coins 3–10 minutes old, 5% bets, +60% / −30%, out in 30 minutes
