# Paper Book settings. Paper money only: nothing here can place a real order.

[memecoins]                               # Night Desk: brand-new Solana coins, live data, paper money
folder = "../night-desk/output/live"      # where `python -m nightdesk run` keeps its results
demo_folder = "../night-desk/output/demo"
start_bank = 100.0                        # same as [desk] start_bank in night-desk/desk.toml

[majors]                                  # Majors Desk: BTC, ETH, SOL, XRP, ADA, DOGE on Coinbase prices
folder = "../majors-desk/output/live"     # where `python -m majors run` keeps its results
demo_folder = "../majors-desk/output/demo"
start_bank = 100.0                        # same as [desk] start_bank in majors-desk/majors.toml

[stocks]                                  # Premarket scanner: gap-up stocks, graded paper picks
journal = "../premarket-scanner/output/journal.csv"
demo_journal = ""                         # empty: the newest demo backtest
start_bank = 100.0
share_bank = true                         # each weekday's picks split the stock bank equally
ticket_usd = 100.0                        # paper dollars per pick, used only when share_bank = false

# The wild desks: riskier copies of the memecoin and stock desks, each on its own paper bank, so the book
# shows side by side whether taking more risk pays. Delete a section to leave that desk out.
[memecoins_wild]                          # Night Desk's wild rulebook (night-desk/desk-wild.toml), same coins
folder = "../night-desk/output/wild/live" # where `python -m nightdesk run --with wild` keeps its results
demo_folder = "../night-desk/output/wild/demo"
start_bank = 100.0                        # same as [desk] start_bank in night-desk/desk-wild.toml

[stocks_wild]                             # the scanner's wild rules (premarket-scanner/criteria-wild.toml)
journal = "../premarket-scanner/output/wild/journal.csv"
demo_journal = ""                         # empty: the newest wild demo backtest
rules = "../premarket-scanner/criteria-wild.toml"
start_bank = 100.0
share_bank = true
ticket_usd = 100.0

[stocks_fade]                             # the scanner's fade rules (premarket-scanner/criteria-fade.toml): the
journal = "../premarket-scanner/output/fade/journal.csv"   # stock desk's picks, sold short at the open
demo_journal = ""
rules = "../premarket-scanner/criteria-fade.toml"
start_bank = 100.0
share_bank = true
ticket_usd = 100.0

[memecoins_strict]                        # Night Desk's strict rulebook (night-desk/desk-strict.toml)
folder = "../night-desk/output/strict/live"
demo_folder = "../night-desk/output/strict/demo"
start_bank = 100.0

[majors_4h]                               # Majors Desk on 4-hour candles (majors-desk/majors-4h.toml)
folder = "../majors-desk/output/4h/live"
demo_folder = "../majors-desk/output/4h/demo"
start_bank = 100.0

[stocks_quick]                            # the scanner's quick rules (criteria-quick.toml): +5% / -3%
journal = "../premarket-scanner/output/quick/journal.csv"
demo_journal = ""
rules = "../premarket-scanner/criteria-quick.toml"
start_bank = 100.0
share_bank = true
ticket_usd = 100.0

[stocks_early]                            # the scanner's early rules (criteria-early.toml): out by 10:30 ET
journal = "../premarket-scanner/output/early/journal.csv"
demo_journal = ""
rules = "../premarket-scanner/criteria-early.toml"
start_bank = 100.0
share_bank = true
ticket_usd = 100.0

[report]
timezone = "America/Los_Angeles"

[alerts]                                  # phone pushes from watchdog.py (turn on with: bash server/alerts.sh)
day_loss_pct = 10.0                       # tell me when a desk loses this much of its bank in one day
summary_at = "20:00"                      # the evening summary, in the [report] time zone
