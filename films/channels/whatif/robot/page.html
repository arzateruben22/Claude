<canvas id="c"></canvas>
<script type="module">
import * as THREE from "three";
import { createRobot, makeEnv, POSES } from "/films/channels/whatif/set/robot.js";
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true, premultipliedAlpha: false });
renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;

  renderer.render(scene, camera); return true;

</script>
