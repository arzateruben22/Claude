# Night Desk, WILD rulebook: the same desk with more risk, run next to the main one on its own paper bank.
#
# Same three kinds of rule as desk.toml ([kill], [ready], [scan]), and the rug checks are
# word-for-word the same: a rug loses the whole stake, and loosening those is how memecoin desks
# blow up. Everything else is looser or bigger, so this desk trades more often and swings harder:
#   * buys coins at 5 minutes old, not 15 (more early pumps, and more early crashes)
#   * half the pool, volume and trade-count minimums, and no website or socials needed
#   * twice the ticket (20% of the bank) and up to 5 coins at once
#   * lets winners run: +100% target, a wider trailing stop, up to 4 hours
#
# Run it with the main desk: python -m nightdesk run --with wild
# Its results live in output/wild/. The paper book shows it as "Wild memecoins".
# Paper money only. Nothing here can place a real order.

[desk]
start_bank = 100.0           # paper dollars
discover_seconds = 60
poll_seconds = 15
watch_minutes = 90

[kill]                       # identical to desk.toml on purpose
max_top_wallet_pct = 5.0
max_top10_pct = 35.0
max_dev_pct = 5.0
require_mint_revoked = true
require_freeze_revoked = true
min_lp_locked_pct = 90.0
kill_on_danger_flags = true

[ready]
min_age_minutes = 5          # main: 15
max_age_hours = 24
min_liquidity_usd = 6000     # main: 12000
min_volume_h1_usd = 7500     # main: 15000
min_mcap_usd = 30000         # main: 60000
max_mcap_usd = 5000000
min_trades_h1 = 75           # main: 150

[scan]
min_buy_pressure = 0.52      # main: 0.55
min_buy_pressure_now = 0.50  # main: 0.55
max_momentum_spent = 0.75    # main: 0.60 (willing to chase a coin that's already run)
min_heat = 0.20              # main: 0.30
min_liquidity_fit = 0.60
min_social = 0.0             # main: 0.34 (no website, X or Telegram needed)

[judge]
use_ai = false               # the rules decide, so this desk never costs anything to run
model = "claude-opus-5-5"
effort = "low"
min_confidence = 0.5         # main: 0.6

[size]
ticket_pct = 20.0            # main: 10
max_pct_of_liquidity = 1.0
max_open = 5                 # main: 3
fee_pct = 1.0                # costs stay honest: same fees and slippage as the main desk
slippage_pct = 1.0

[risk]
take_profit_pct = 100.0      # main: 40
stop_loss_pct = 25.0         # main: 20
trail_arm_pct = 30.0         # main: 20
trail_pct = 20.0             # main: 15
max_hold_minutes = 240       # main: 120
rug_liquidity_drop_pct = 50.0
daily_loss_limit_pct = 30.0  # main: 15
cooldown_minutes = 30        # main: 60

# The bar before real money is NOT lowered: a riskier desk has to clear the same scorecard.
[gates]
min_trades = 100
min_days = 30
min_profit_factor = 1.3
min_sharpe = 1.0
max_drawdown_pct = 25.0
best_trades_share = 0.05
cost_multiplier = 2.0
recent_share = 0.33

[review]
use_ai = true                # needs ANTHROPIC_API_KEY; otherwise rule-based
model = "claude-opus-5-5"
effort = "high"
lookback_days = 7
