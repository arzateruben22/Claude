# Majors Desk, RUSH rulebook: twenty coins, bought when one starts a run (an XRP or QNT week) in an uptrend.
#
# A coin is bought when its daily close is above its 50-day average AND above its highest price of the
# previous 7 days: it's breaking out while the trend is up. It's sold on a daily close below its 5-day low,
# or on a trailing stop three daily moves under its best close since buying. Up to four coins at a time,
# each at most a quarter of the bank. It rides the runs and gets out when they stall; in a falling market it
# mostly sits in cash, because almost nothing is above its 50-day average.
# Fees and slippage are set higher than the big-coin desks', because the smaller coins trade thinner.
# A coin Coinbase stops listing is skipped, not fatal.
# Paper money only. Nothing here can place a real order.

[desk]
start_bank = 1000.0                                  # paper dollars
coins = ["BTC", "ETH", "SOL", "XRP", "ADA", "DOGE", "LINK", "AVAX", "LTC", "DOT",
         "XLM", "HBAR", "BCH", "AAVE", "UNI", "QNT", "NEAR", "ATOM", "ETC", "FIL"]
quote = "USD"
candle_hours = 24            # one decision a day, on the daily close at midnight UTC

[rules]
trend_hours = 1200           # 50 days
breakout_hours = 168         # 7 days
exit_hours = 120             # 5 days
atr_hours = 336              # 14 days
stop_atr = 3.0
risk_pct = 4.0               # sized so a stop-out costs about 4% of the bank...
max_position_pct = 25.0      # ...but never more than a quarter of it in one coin
max_positions = 4
cooldown_hours = 72

[costs]
fee_pct = 0.40               # per side
slippage_pct = 0.15          # per side: thinner coins move more against you
