# Majors Desk, SECTORS rulebook: buy the parts of the stock market that are breaking out, in an uptrend.
#
# The eleven sector funds (technology, banks, energy, health care...) plus the chip-makers' fund. A fund is
# bought when its daily close is above its 100-day average AND above its highest price of the previous 55
# trading days: money is moving into that corner of the market. It's sold on a close below the lowest price of
# the previous 20 days, or on a trailing stop three daily moves under its best close. Up to four at a time.
# This is the classic turtle breakout, on funds rather than single companies, so one bad earnings report
# can't sink it. Daily bars from Alpaca (bash server/keys.sh).
# Paper money only. Nothing here can place a real order.

[desk]
start_bank = 1000.0                                  # paper dollars
coins = ["XLK", "XLF", "XLE", "XLV", "XLI", "XLY", "XLP", "XLU", "XLB", "XLRE", "XLC", "SMH"]
quote = "USD"
candle_hours = 24            # one decision per trading day
source = "alpaca"

[rules]
trend_hours = 2400           # 100 trading days
breakout_hours = 1320        # 55 trading days
exit_hours = 480             # 20 trading days
atr_hours = 336              # 14 trading days
stop_atr = 3.0
risk_pct = 1.5               # sized so a stop-out costs about 1.5% of the bank...
max_position_pct = 25.0      # ...but never more than a quarter of it in one fund
max_positions = 4
cooldown_hours = 72

[costs]
fee_pct = 0.0                # no commission
slippage_pct = 0.05
