# RETIRED 22 Oct 2026: lost 60.3% over the past year (114 trades, profit factor 0.39). Kept for the record; the server no longer runs it.
# Majors Desk, SINGLE rulebook: one bet at a time, and a big one.
#
# The main desk's hourly rules, but it holds at most one coin, puts up to 80% of the bank in it and risks 2%.
# Concentration against the main desk's spread of four.
# Fees and slippage are the main desk's. Every window is in hours, whatever the candle.
# Run it with the main desk: python -m majors run --with single. Results live in output/single/.
# Paper money only. Nothing here can place a real order.

[desk]
start_bank = 100.0                                   # paper dollars
coins = ["BTC", "ETH", "SOL", "XRP", "ADA", "DOGE"]  # traded against US dollars on Coinbase
quote = "USD"
candle_hours = 1                                     # decide on finished hourly candles (4 = 4-hour candles, 24 = daily)

# Trend following on hourly candles: buy a breakout while the trend is up, then ride it with a
# trailing stop. Most trades lose a little; the few long trends pay for them. Decisions are made
# on each hour's closing price.
[rules]
trend_hours = 100          # only buy when the price is above its 100-hour average
breakout_hours = 48        # ...and the hour closes above the highest price of the previous 48 hours
exit_hours = 24            # sell when an hour closes below the lowest price of the previous 24 hours
atr_hours = 14             # how far a coin normally moves in an hour, averaged over 14 hours
stop_atr = 3.0             # ...or sell when it falls 3 of those moves below its best close since buying
risk_pct = 2.0               # (main: 1.0)
max_position_pct = 80.0      # one big bet (main: 25.0)
max_positions = 1            # one at a time (main: 4)
cooldown_hours = 6         # after selling a coin, wait this long before buying it again

[costs]                    # charged on every paper buy and sell
fee_pct = 0.40             # per side: a typical exchange fee for a small account (check yours)
slippage_pct = 0.05        # per side: the price moves a little against you when you fill
